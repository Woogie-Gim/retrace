<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 - Demo Shop</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Demo Shop 로그인</h1>
    <div class="card row">
      <label for="grade">회원 등급</label>
      <select id="grade" data-testid="login-grade">
        <option value="normal">일반</option>
        <option value="silver">실버</option>
        <option value="gold">골드</option>
      </select>
      <button class="primary" data-testid="login-submit" id="submit">로그인</button>
    </div>
    <p class="error" data-testid="error-message" id="error"></p>
  </main>
  <script src="common.js"></script>
  <script>
    document.getElementById("submit").addEventListener("click", async () => {
      try {
        const grade = document.getElementById("grade").value;
        await api("/api/login", { method: "POST", body: JSON.stringify({ grade }) });
        location.href = "products.html";
      } catch (e) {
        document.getElementById("error").textContent = e.message;
      }
    });
  </script>
</body>
</html>
